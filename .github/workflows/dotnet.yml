name: RaceDay API CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: RaceDay.API

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore API
        run: dotnet restore RaceDay.API.csproj

      - name: Build API
        run: dotnet build RaceDay.API.csproj --no-restore --configuration Release

      - name: Restore Tests
        run: dotnet restore ..\RaceDay.API.Tests\RaceDay.API.Tests.csproj 2>$null || dotnet restore ../RaceDay.API.Tests/RaceDay.API.Tests.csproj

      - name: Test
        run: dotnet test ../RaceDay.API.Tests/RaceDay.API.Tests.csproj --configuration Release --verbosity normal
